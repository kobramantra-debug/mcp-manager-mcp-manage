[project]
name = "mcp-manager"
version = "0.1.0"
description = "Universal MCP Server Manager - add, remove, monitor and configure all your MCP servers from one place"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MCP Manager Contributors" }]
keywords = ["mcp", "model-context-protocol", "server", "manager", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp[cli]>=2.0.0",
    "cryptography>=44.0.0",
]

[project.urls]
Homepage = "https://github.com/kobramantra-debug/mcp-manager-mcp-manage"
Repository = "https://github.com/kobramantra-debug/mcp-manager-mcp-manage"
Issues = "https://github.com/kobramantra-debug/mcp-manager-mcp-manage/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
